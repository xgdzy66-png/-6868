services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      BOT_USERNAME: ${BOT_USERNAME:-kucunxbot}
      BOT_WEBHOOK_URL: https://${DOMAIN:?Set DOMAIN in .env}
      DATABASE_URL: mysql+pymysql://bot:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@db:3306/inventory
      ALLOW_PLAINTEXT_DB: "1"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - front
      - database
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: bot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - database
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - front
volumes:
  mysql-data:
  caddy-data:
  caddy-config:
networks:
  front:
  database:
    internal: true
